<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Send our FULL url (path contains "anichi.to") as the Referer: the
         upstream player's ad loader whitelists referrers containing that
         string and injects NO ad script at all for them. -->
    <meta name="referrer" content="unsafe-url" />
    <title>Player</title>
    <script>
      (function() {
        var dummyWin = {
          closed: false,
          close: function() { this.closed = true; },
          focus: function() {},
          blur: function() {},
          postMessage: function() {},
          location: { href: '', replace: function() {}, assign: function() {} },
          document: { write: function() {}, close: function() {}, open: function() {} }
        };
        window.open = function() { return dummyWin; };
        window.alert = function() { return null; };
        window.confirm = function() { return true; };
        window.prompt = function() { return null; };
      })();
    </script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      let directSrc = params.get("src");
      let mal = parseInt(params.get("mal") || "0", 10);
      let ep = parseInt(params.get("ep") || "0", 10);
      let cat = params.get("cat") === "dub" ? "dub" : "sub";
      let frame = null;

      function getUrl(m, e, c, auto) {
        return directSrc ? directSrc : "https://megaplay.buzz/stream/mal/" + m + "/" + e + "/" + c + "?autostart=" + (auto ? "true" : "false");
      }

      if (directSrc || (mal > 0 && ep > 0)) {
        frame = document.createElement("iframe");
        frame.src = getUrl(mal, ep, cat, false);
        frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
        frame.setAttribute("allowfullscreen", "");
        document.body.appendChild(frame);

        function syncFs(active) {
          try {
            frame.contentWindow.postMessage(JSON.stringify({ megaFullscreenState: Boolean(active) }), "*");
          } catch(e) {}
        }

        frame.addEventListener("load", function() {
          syncFs(false);
          try {
            window.parent.postMessage(JSON.stringify({ megaCommand: "getFullscreenState" }), "*");
          } catch(e) {}
        });

        // Relay messages both ways and handle in-place episode switches without unmounting
        window.addEventListener("message", function(ev) {
          if (ev.source === frame.contentWindow) {
            let data = ev.data;
            if (typeof data === "string") {
              try { data = JSON.parse(data); } catch(e) {}
            }
            if (data && data.megaCommand === "getFullscreenState") {
              window.parent.postMessage(JSON.stringify({ megaCommand: "getFullscreenState" }), "*");
              return;
            }
            if (data && data.megaCommand === "toggleFullscreen") {
              window.parent.postMessage(JSON.stringify({ megaCommand: "toggleFullscreen" }), "*");
              return;
            }
            window.parent.postMessage(ev.data, "*");
          } else if (ev.source === window.parent) {
            let data = ev.data;
            if (typeof data === "string") {
              try { data = JSON.parse(data); } catch(e) {}
            }
            if (data && data.cmd === "LOAD_EPISODE") {
              mal = data.mal || mal;
              ep = data.ep;
              cat = data.cat || cat;
              frame.src = getUrl(mal, ep, cat, true);
              return;
            }
            if (data && typeof data.megaFullscreenState === "boolean") {
              syncFs(data.megaFullscreenState);
              return;
            }
            frame.contentWindow.postMessage(ev.data, "*");
          }
        });
      } else {
        document.body.textContent = "Missing stream parameters.";
      }
    </script>
  </body>
</html>
